<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080D" />
    <meta name="description" content="PRISM: career guidance that weighs a student's interests, the family's budget and real job demand, and shows its working." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 3 28h26z' fill='none' stroke='%2300E5FF' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M16 3v25' stroke='%237C6CFF' stroke-width='1.4'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>PRISM · See every path</title>
    <script>
      // Apply the saved theme before first paint (no flash).
      try {
        var s = JSON.parse(localStorage.getItem('prism-settings') || '{}')
        var t = s.theme === 'light' || s.theme === 'dark' ? s.theme
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = t
        if (s.textSize) document.documentElement.style.fontSize = s.textSize + '%'
      } catch (e) {}
    </script>
    <style>
      /* ── Loading screen: brain → signals → prism → PRISM. Runs before any JavaScript. ── */
      #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#05060B;color:#E8F7FF;
        --t:1;transition:opacity .3s ease, filter .3s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
      #boot.short{--t:.32}
      #boot.out{opacity:0;filter:brightness(1.6) blur(2px);pointer-events:none}
      #boot .stack{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(340px,78vw)}
      #boot svg{display:block;overflow:visible}
      #boot .brain{width:100%;height:auto}
      #boot .brain .bline,#boot .brain .gyri path{fill:none;stroke-linecap:round;stroke-linejoin:round}
      #boot .brain .bline{stroke:url(#neon);stroke-width:2.6;stroke-dasharray:1200;stroke-dashoffset:1200;
        animation:bdraw calc(var(--t)*.7s) cubic-bezier(.6,.05,.3,1) forwards}
      #boot .brain .gyri path{stroke:#00E5FF;stroke-opacity:.55;stroke-width:1.4;stroke-dasharray:400;stroke-dashoffset:400;
        animation:bdraw calc(var(--t)*.7s) ease-out forwards;animation-delay:calc(var(--t)*.3s)}
      #boot .pulses{opacity:0;animation:fade calc(var(--t)*.4s) ease-out forwards;animation-delay:calc(var(--t)*.75s)}
      #boot .syn{fill:#B9F6FF;opacity:0;transform-box:fill-box;transform-origin:center;animation:syn 1.6s ease-in-out infinite}
      #boot .prism{width:42%;height:auto}
      #boot .prism .edge{fill:none;stroke:#00E5FF;stroke-width:2;stroke-linejoin:round;stroke-dasharray:360;stroke-dashoffset:360;
        animation:bdraw calc(var(--t)*.5s) ease-out forwards;animation-delay:calc(var(--t)*.7s)}
      #boot .prism .glass{opacity:0;animation:fade calc(var(--t)*.35s) ease-out forwards;animation-delay:calc(var(--t)*1.15s)}
      #boot .prism .beam{stroke:#fff;stroke-width:1.6;stroke-dasharray:80;stroke-dashoffset:80;
        animation:bdraw calc(var(--t)*.3s) ease-in forwards;animation-delay:calc(var(--t)*1.2s)}
      #boot .prism .ray{stroke-width:1.8;stroke-linecap:round;stroke-dasharray:90;stroke-dashoffset:90;
        animation:bdraw calc(var(--t)*.35s) ease-out forwards;animation-delay:calc(var(--t)*1.45s)}
      #boot .word{width:78%;height:auto}
      #boot .word text{font:800 54px "Bricolage Grotesque",system-ui,sans-serif;fill:transparent;stroke:#7FF2FF;stroke-width:1.1;
        stroke-dasharray:240;stroke-dashoffset:240;transform-box:fill-box;
        animation:wdraw calc(var(--t)*.55s) ease-out forwards, wfill calc(var(--t)*.4s) ease-out forwards, wslide calc(var(--t)*.8s) cubic-bezier(.2,.8,.2,1) forwards;
        animation-delay:calc(var(--t)*(1s + var(--i)*.09s)), calc(var(--t)*(1.45s + var(--i)*.09s)), calc(var(--t)*(1s + var(--i)*.09s))}
      #boot .cap{font:500 13px Inter,system-ui,sans-serif;letter-spacing:.02em;color:#8FA6C2;opacity:0;
        animation:fade calc(var(--t)*.4s) ease-out forwards;animation-delay:calc(var(--t)*1.8s);text-align:center}
      #boot .slowmsg{font:500 12px Inter,system-ui,sans-serif;color:#5D7290;opacity:0;transition:opacity .4s}
      #boot.slow .slowmsg{opacity:1}
      #boot .skip{position:absolute;bottom:22px;font:500 11px Inter,system-ui,sans-serif;color:#3F5068}
      @keyframes bdraw{to{stroke-dashoffset:0}}
      @keyframes fade{to{opacity:1}}
      @keyframes syn{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.9;transform:scale(1)}}
      @keyframes wdraw{to{stroke-dashoffset:0}}
      @keyframes wfill{to{fill:#F2FCFF;filter:drop-shadow(0 0 6px #00E5FF)}}
      @keyframes wslide{from{transform:translateX(calc((var(--i) - 2) * 9px))}to{transform:none}}
      #boot.still *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}
      #boot.still .word text{fill:#F2FCFF}
      #boot.still .pulses{display:none}
      @media (prefers-reduced-motion: reduce){
        #boot *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}
        #boot .word text{fill:#F2FCFF}
        #boot .pulses{display:none}
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite" aria-label="PRISM is loading">
      <div class="stack" aria-hidden="true">
        <svg class="brain" viewBox="0 0 260 200">
          <defs>
            <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2F6BFF" /><stop offset=".55" stop-color="#00C2FF" /><stop offset="1" stop-color="#00E5FF" />
            </linearGradient>
            <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2.6" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
            <radialGradient id="pulse"><stop offset="0" stop-color="#fff" /><stop offset=".45" stop-color="#7FF2FF" /><stop offset="1" stop-color="#00E5FF" stop-opacity="0" /></radialGradient>
          </defs>
          <g filter="url(#glow)">
            <path class="bline" d="M48 128C30 118 26 92 38 74C44 52 62 36 86 32C100 20 124 16 142 22C160 14 186 18 200 32C222 36 238 54 236 76C246 92 240 112 226 120C222 132 208 138 194 136C186 146 170 150 156 146C146 148 136 146 128 140C116 146 98 146 88 140C74 144 58 140 48 128Z" />
            <path class="bline" d="M184 140C196 146 212 147 222 135C226 151 213 163 197 163C185 163 177 153 184 140Z" />
            <path class="bline" d="M158 147C163 160 165 172 161 187M173 147C176 160 178 172 176 187" />
            <g class="gyri">
              <path id="g1" d="M60 70C78 60 90 72 106 62C118 54 132 60 140 52" />
              <path id="g2" d="M50 96C66 86 80 98 96 88C112 78 126 90 142 82C156 74 170 84 184 76" />
              <path id="g3" d="M70 118C86 108 98 120 116 112C132 104 146 114 160 106C176 98 192 108 210 100" />
              <path id="g4" d="M150 30C154 44 146 56 156 66C166 76 160 90 170 98" />
              <path id="g5" d="M186 30C178 44 192 54 184 68C178 80 194 88 190 104" />
              <path id="g6" d="M100 34C96 48 108 56 102 70" />
              <path id="g7" d="M214 52C204 62 220 74 208 86C200 96 214 106 206 118" />
              <path id="g8" d="M84 128C104 120 126 124 146 118C160 114 172 118 182 124" />
              <path id="g9" d="M120 26C126 40 118 52 126 64C132 74 124 84 130 96" />
              <path id="g10" d="M44 110C56 102 66 112 80 104" />
            </g>
            <g class="pulses">
              <circle class="syn" cx="142" cy="82" r="3" style="animation-delay:.2s" />
              <circle class="syn" cx="156" cy="66" r="3" style="animation-delay:.7s" />
              <circle class="syn" cx="184" cy="76" r="3" style="animation-delay:1.1s" />
              <circle class="syn" cx="116" cy="112" r="3" style="animation-delay:.45s" />
              <circle class="syn" cx="106" cy="62" r="3" style="animation-delay:1.3s" />
              <circle r="2.6" fill="url(#pulse)"><animateMotion dur="1.9s" repeatCount="indefinite"><mpath href="#g2" /></animateMotion></circle>
              <circle r="2.2" fill="url(#pulse)"><animateMotion dur="2.4s" begin=".3s" repeatCount="indefinite"><mpath href="#g3" /></animateMotion></circle>
              <circle r="2.2" fill="url(#pulse)"><animateMotion dur="1.6s" begin=".1s" repeatCount="indefinite"><mpath href="#g1" /></animateMotion></circle>
              <circle r="2" fill="url(#pulse)"><animateMotion dur="1.3s" begin=".5s" repeatCount="indefinite"><mpath href="#g4" /></animateMotion></circle>
              <circle r="2" fill="url(#pulse)"><animateMotion dur="1.5s" begin=".2s" repeatCount="indefinite"><mpath href="#g5" /></animateMotion></circle>
              <circle r="1.8" fill="url(#pulse)"><animateMotion dur="1.1s" begin=".4s" repeatCount="indefinite"><mpath href="#g6" /></animateMotion></circle>
              <circle r="2" fill="url(#pulse)"><animateMotion dur="1.7s" begin=".6s" repeatCount="indefinite"><mpath href="#g7" /></animateMotion></circle>
              <circle r="2.2" fill="url(#pulse)"><animateMotion dur="2.1s" begin=".9s" repeatCount="indefinite"><mpath href="#g8" /></animateMotion></circle>
              <circle r="1.8" fill="url(#pulse)"><animateMotion dur="1.4s" begin=".25s" repeatCount="indefinite"><mpath href="#g9" /></animateMotion></circle>
              <circle r="1.8" fill="url(#pulse)"><animateMotion dur="1s" begin=".7s" repeatCount="indefinite"><mpath href="#g10" /></animateMotion></circle>
              <circle r="2.4" fill="url(#pulse)"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#g2" /></animateMotion></circle>
              <circle r="2" fill="url(#pulse)"><animateMotion dur="2.6s" begin="1.4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#g3" /></animateMotion></circle>
              <circle r="1.8" fill="url(#pulse)"><animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#g8" /></animateMotion></circle>
              <circle r="1.8" fill="url(#pulse)"><animateMotion dur="1.5s" begin=".9s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#g5" /></animateMotion></circle>
            </g>
          </g>
        </svg>
        <svg class="prism" viewBox="-70 -40 260 150">
          <defs>
            <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#00E5FF" stop-opacity=".22" /><stop offset="1" stop-color="#2F6BFF" stop-opacity=".05" />
            </linearGradient>
          </defs>
          <line class="beam" x1="60" y1="-40" x2="40" y2="40" />
          <path class="glass" d="M60 0L120 100H0Z" fill="url(#glass)" />
          <path class="edge" d="M60 0L120 100H0Z" filter="url(#glow)" />
          <g>
            <line class="ray" x1="88" y1="52" x2="178" y2="20" stroke="#7C6CFF" />
            <line class="ray" x1="90" y1="55" x2="182" y2="38" stroke="#3B8BFF" style="animation-delay:calc(var(--t)*1.5s)" />
            <line class="ray" x1="92" y1="58" x2="184" y2="56" stroke="#14B8A6" style="animation-delay:calc(var(--t)*1.55s)" />
            <line class="ray" x1="94" y1="61" x2="182" y2="74" stroke="#65C23A" style="animation-delay:calc(var(--t)*1.6s)" />
            <line class="ray" x1="96" y1="64" x2="178" y2="92" stroke="#F2B01E" style="animation-delay:calc(var(--t)*1.65s)" />
            <line class="ray" x1="98" y1="67" x2="172" y2="108" stroke="#F0544F" style="animation-delay:calc(var(--t)*1.7s)" />
          </g>
        </svg>
        <svg class="word" viewBox="0 0 300 64">
          <text x="10" y="54" style="--i:0">P</text>
          <text x="68" y="54" style="--i:1">R</text>
          <text x="126" y="54" style="--i:2">I</text>
          <text x="152" y="54" style="--i:3">S</text>
          <text x="206" y="54" style="--i:4">M</text>
        </svg>
      </div>
      <p class="cap">See every path. Choose yours together.</p>
      <p class="slowmsg">Loading…</p>
      <p class="skip">Tap to skip</p>
    </div>
    <div id="root" aria-busy="true"></div>
    <script>
      (function () {
        var el = document.getElementById('boot'); if (!el) return
        var seen = false, reduce = false
        try { seen = sessionStorage.getItem('prism-boot') === '1'; sessionStorage.setItem('prism-boot', '1') } catch (e) {}
        try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || JSON.parse(localStorage.getItem('prism-settings') || '{}').reduceMotion === true } catch (e) {}
        if (reduce) el.classList.add('still'); else if (seen) el.classList.add('short')
        var min = reduce ? 600 : seen ? 900 : 2250, t0 = performance.now(), ready = false, skipped = false, done = false
        function hide () {
          if (done) return; done = true; el.classList.add('out')
          var root = document.getElementById('root'); if (root) root.removeAttribute('aria-busy')
          setTimeout(function () { el.remove() }, 340)
        }
        function tryHide () { if (ready) setTimeout(hide, skipped ? 0 : Math.max(0, min - (performance.now() - t0))) }
        window.__prismReady = function () { ready = true; tryHide() }
        function skip () { skipped = true; tryHide() }
        el.addEventListener('click', skip); addEventListener('keydown', skip, { once: true })
        setTimeout(function () { if (!done) el.classList.add('slow') }, 3500)
        setTimeout(hide, 9000) // never trap the page if the app fails to start
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
